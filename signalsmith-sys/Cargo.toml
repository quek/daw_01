[package]
name = "signalsmith-sys"
description = "Vendored C ABI bindings to Signalsmith Stretch (MIT) — spectral time-stretch / pitch-shift / formant-shift engine used by daw_audio's StretchMode::Stretch and the formant stage."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
# ラッパー (src/lib.rs / shim/*) は GPL-3.0-or-later。
# vendor/signalsmith-{stretch,linear}/** は MIT (Geraint Luff /
# Signalsmith Audio Ltd.)。 帰属は NOTICE を参照。
license = "GPL-3.0-or-later AND MIT"
repository.workspace = true
publish.workspace = true

[features]
# Count C++ heap allocations so the RT no-alloc test can actually see them.
# Rust の `#[global_allocator]` フック (assert_no_alloc) は Rust の
# `GlobalAlloc` しか捕まえないので、vendored エンジンの `std::vector` 成長
# (C++ `operator new` → CRT malloc) は **完全に不可視**。 この feature を
# 有効にすると shim が global `operator new` / `delete` を置換してカウンタを
# 回し、`sms_alloc_count()` で読めるようにする。
# daw_audio の `rt-assert` から有効化される。 通常ビルドには一切入らない。
alloc-count = []

[build-dependencies]
cc = "1"
