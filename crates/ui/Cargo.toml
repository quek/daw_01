[package]
name = "daw-ui-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = ["dialog", "clipboard"]
# M8 Phase 34: native file dialog (rfd 経由)。
# Linux で gtk/portal の挙動が脆い場合は無効化可能。
dialog = ["dep:rfd"]
# M8 Phase 31: OS clipboard 統合 (arboard 経由)。
# CI / 無 GUI 環境向けに無効化可能 (NoopClipboard だけ残る)。
clipboard = ["dep:arboard"]

[dependencies]
daw-ui-platform.workspace = true
daw-ui-renderer.workspace = true
taffy = "0.10.1"
# M14 Phase 58: text_input の cursor / selection 位置を proportional font の実 advance で計算するため、
# cosmic-text を直接依存に追加 (renderer の glyphon 0.11 が使う 0.18.2 と同一バージョンで揃える)。
cosmic-text = "0.18.2"
rfd = { version = "0.15", optional = true }
arboard = { version = "3", optional = true }

[dev-dependencies]
criterion = { version = "0.5", default-features = false }
trybuild = "1"

[[bench]]
name = "waveform"
harness = false

[[bench]]
name = "scenegraph_cache"
harness = false

[[bench]]
name = "heavy_piano_roll"
harness = false

[[bench]]
name = "heavy_arrangement"
harness = false
