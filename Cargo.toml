[workspace]
resolver = "3"
members = ["common", "daw_gui", "daw_audio", "daw_plugin_host"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
anyhow = "1"
arc-swap = "1"
assert_no_alloc = "1"
base64 = "0.22"
bincode = { version = "2", features = ["derive"] }
clap-sys = "0.5"
com-scrape-types = "0.1"
dirs = "5"
hound = "3"
# v13 image overlay (docs/plan_image_overlay.md §P2): PNG / JPEG / WebP
# / BMP / TIFF / TGA / GIF (static) decode → `RgbaImage` buffer. Pure
# Rust, no system deps. WebP and GIF decode are enabled by default
# features.
image = "0.25"
cpal = "0.15"
libloading = "0.8"
midir = "0.10"
midly = "0.5"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shared_memory = "0.12"
tempfile = "3"
unicode-width = "0.2"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "io-util", "process", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
reqwest = { version = "0.12", features = ["blocking"] }
vst3 = "0.3"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D10", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi", "Win32_Media_MediaFoundation", "Win32_Security", "Win32_Storage_Xps", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_JobObjects", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_Variant", "Win32_UI_WindowsAndMessaging"] }
daw-ui-platform = { path = "../gui_01/crates/platform" }
daw-ui-renderer = { path = "../gui_01/crates/renderer" }
daw-ui-core = { path = "../gui_01/crates/ui" }
winit = "0.30.13"
raw-window-handle = "0.6.2"
# Match gui_01 (crates/renderer/Cargo.toml) — passing `wgpu::TextureFormat`
# across the API boundary needs the same crate version, otherwise the
# nominal types are incompatible at the language level.
wgpu = "29.0.1"
