[workspace]
resolver = "3"
members = [
    "common",
    "daw_gui",
    "daw_audio",
    "daw_plugin_host",
    "ara-sys",
    "signalsmith-sys",
    # UI ライブラリ (旧 gui_01 / daw-ui)。daw_01/ui/ に統合 (subtree merge, 履歴保持)。
    "ui/crates/platform",
    "ui/crates/renderer",
    "ui/crates/ui",
    "ui/crates/examples/*",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
# 旧 gui_01 crate (ui/crates/*) が rust-version / license / publish を
# *.workspace = true で継承するため、 統合に伴いここに集約する。
rust-version = "1.95"
# r.md #60: GPLv3 公開。 ここが workspace 全体のライセンス SSoT で、 各 crate は
# `license.workspace = true` で継承する。 **vendored な第三者コードを package
# ディレクトリ内に抱える 3 crate だけは継承せず、 複合 SPDX 式を自分で書く**
# (ara-sys = Apache-2.0 / signalsmith-sys = MIT / daw_gui = LGPL-2.1-or-later の
# FFmpeg binding)。 帰属の一覧は NOTICE、 依存クレートは THIRD-PARTY-NOTICES.md。
authors = ["Tahara Yoshinori"]
license = "GPL-3.0-or-later"
repository = "https://github.com/quek/daw_01"
publish = false

[workspace.dependencies]
anyhow = "1"
arc-swap = "1"
assert_no_alloc = "1"
base64 = "0.22"
bincode = { version = "2", features = ["derive"] }
clap-sys = "0.5"
com-scrape-types = "0.1"
dirs = "5"
hound = "3"
# v13 image overlay (docs/plan_image_overlay.md §P2): PNG / JPEG / WebP
# / BMP / TIFF / TGA / GIF (static) decode → `RgbaImage` buffer. Pure
# Rust, no system deps. import_image::is_supported_extension がこの 7 形式に
# 限定する SSoT なので、default-features を切って同じ 7 つだけを明示有効化する。
# これで未使用の avif (= ravif AVIF encoder、単体コンパイル ~28s) / exr / hdr /
# qoi / ico / pnm / dds が依存ツリーから外れ、コールドビルドが縮む (moxcms は
# image の hard dep なので残る)。arboard 経由の image エッジは bmp 等を独立に
# 有効化しており avif を引かないので、この絞り込みは安全に効く。
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "tiff", "tga", "gif"] }
# ui/crates/examples/* が各自 `png = "0.17"` を直接指定しており、image (0.25) が推移的に
# 解決する png 0.18.1 と2バージョン重複コンパイルされていた (cargo tree --duplicates で確認)。
# この定義に揃えて統一する (現消費者は embedded_host のみ)。
# 注: daw_gui の [build-dependencies] ico (#47 アプリアイコン生成) は内部で png ^0.17 を
# 固定要求しており、ico 自身の Cargo.toml 由来で workspace.dependencies からは制御できない。
# 統一後も ico 経由の png 0.17.16 は1個だけ残る (影響は縮小のみ、完全ゼロ化ではない)。
png = "0.18"
# 0.17: 0.15.3 は WASAPI callback thread の priority boost が壊れている
# (thread id を HANDLE として SetThreadPriority に渡し必ず失敗・握り潰し)。
# 0.17 は audio_thread_priority で正式対応 (docs/plan_arch_refactor.md §5)。
cpal = "0.17"
# Pure-Rust audio-file decoder — the single **cross-platform** decode engine for
# imported audio sources (WAV / AIFF / FLAC / MP3 / OGG-Vorbis / M4A AAC+ALAC).
# rsmpeg (libav) is Windows-only in this workspace and is reserved for VIDEO
# decode; audio import is core DAW function and must stay cross-platform (Linux
# 配慮), so it does NOT go through libav. default-features off + an explicit
# format/codec list mirrors the `image` scoping above to keep cold builds lean
# (formats: wav/aiff/ogg/isomp4 containers; codecs: pcm/adpcm for WAV+AIFF,
# flac, mp3, vorbis, aac+alac for m4a). r.md #19.
# Pinned to 0.5 deliberately (not the newer 0.6.0): 0.6.0 is a 2026-05 breaking
# rewrite (renamed probe/decoder API, GenericAudioBufferRef, Result<Option<_>>
# EOS) whose own GETTING_STARTED.md is internally inconsistent about module
# paths; 0.5.5 is the battle-tested API this decoder is written against. Revisit
# when 0.6.x stabilizes its docs.
symphonia = { version = "0.5", default-features = false, features = ["wav", "aiff", "ogg", "isomp4", "pcm", "adpcm", "flac", "mp3", "vorbis", "aac", "alac"] }
libloading = "0.8"
# SMF (MIDI ファイル) の歌詞 / トラック名 meta は文字コードが規定されておらず、
# 日本語ファイルは Shift-JIS が普通 (r.md #66 MIDI import)。UTF-8 デコードに
# 失敗したときの fallback に使う。
encoding_rs = "0.8"
midir = "0.10"
midly = "0.5"
# r.md #50: マスターパネルのスペクトラムアナライザ用 実数入力 FFT
# (rustfft の実信号ラッパ)。daw_gui のテレメトリスレッドでのみ使う (RT パス外)。
realfft = "3"
rfd = "0.15"
# wait-free SPSC ring for the RT audio thread to hand superseded routing
# schedules back to the off-thread compiler for disposal (D1: zero RT alloc/free).
rtrb = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# resource monitor (r.md #3): システム CPU / メモリを 3 プロセス分ポーリング。
# cross-platform (Linux 配慮) で、 daw_gui の UI 側スレッドからのみ使う (RT パス外)。
sysinfo = "0.33"
tempfile = "3"
unicode-width = "0.2"
uuid = { version = "1", features = ["v4"] }
# "time": daw_audio の recv loop が `tokio::time::interval` で周期 housekeeping
# (superseded bundle の解放 = shmem unmap / worker rig join) を回すため。
# メッセージ到着に依存させないための唯一の手段 (`daw_audio::recv_loop_housekeeping`)。
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "io-util", "process", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
# non-blocking, daily-rolling file appender for tracing. Lets all 3 processes
# keep logs on disk after going windows-subsystem (no console) in release.
# 0.2.5 depends on tracing-subscriber ^0.3.18 — ABI-compatible with the 0.3.x
# resolved here. See docs/plan_icon_and_console.md (#48).
tracing-appender = "0.2.5"
reqwest = { version = "0.12", features = ["blocking"] }
vst3 = "0.3"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security", "Win32_Storage_Xps", "Win32_System_Com", "Win32_System_JobObjects", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_Shutdown", "Win32_System_Threading", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
# UI ライブラリ (旧 gui_01)。統合により ../gui_01/crates/* → ui/crates/* へ。
# この 3 定義が daw_gui と ui/crates 内部の両方の解決元 (単一定義)。
daw-ui-platform = { path = "ui/crates/platform" }
daw-ui-renderer = { path = "ui/crates/renderer" }
daw-ui-core = { path = "ui/crates/ui" }
winit = "0.30.13"
raw-window-handle = "0.6.2"
# 単一 workspace = 単一 Cargo.lock になったので wgpu は ui/crates/renderer と
# 自動で同一バージョンに unify される (旧来の手動 byte 一致同期は不要)。
wgpu = "29.0.1"

# 旧 gui_01 の lints。ui/crates/* のみ [lints] workspace = true で opt-in する。
# daw_01 既存 crate は opt-in しないので pedantic は適用されない。
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# DAW-GUI 設計上 derive(Clone) 等を要求しない方針なので一部 pedantic を緩める
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
# 日本語ドキュメントでの偽陽性を避ける
doc_markdown = "allow"
# ライフタイム名は明示の方がドキュメントとして読みやすい場面があるため
elidable_lifetime_names = "allow"
# 1 関数 1 役で書きやすくするため
needless_pass_by_value = "allow"
unreadable_literal = "allow"

# 旧 gui_01 の profile。wgpu/glyphon は debug が遅すぎるので軽く最適化する。
# profile は workspace 全体 (root のみ有効) なので daw_01 crate にも効く。
[profile.dev]
opt-level = 1
debug = true

[profile.dev.package."*"]
opt-level = 3            # 依存 crate は full 最適化

# オーディオ経路の最適化は維持しつつ、ビルド時間だけを削る方針。
# - opt-level=3 / lto="thin" は据え置き (runtime 性能を犠牲にしない)。
# - codegen-units は 1 → 16 (= 非 incremental ビルドの既定値)。1 は crate 内のコード生成を
#   単一スレッドに直列化し、daw_gui (~50k 行) / ui (~47k 行) の巨大 crate で 32 コアマシンの
#   1 コアしか使えなくしていた (差分ビルドの最大ボトルネック)。lto="thin" 下では 1 の runtime
#   寄与は限界的 (cross-crate inline は thin-LTO が担う) なので、並列化を取る。
#   docs: https://doc.rust-lang.org/cargo/reference/profiles.html#codegen-units
# 最大最適化の配布ビルドが要るときは codegen-units=1 + lto="fat" の別 profile を切ること。
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
