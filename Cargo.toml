[workspace]
resolver = "3"
members = ["common", "daw_gui", "daw_audio", "daw_plugin_host"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
anyhow = "1"
arc-swap = "1"
assert_no_alloc = "1"
base64 = "0.22"
bincode = { version = "2", features = ["derive"] }
clap-sys = "0.5"
com-scrape-types = "0.1"
dirs = "5"
hound = "3"
cpal = "0.15"
libloading = "0.8"
midir = "0.10"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shared_memory = "0.12"
tempfile = "3"
unicode-width = "0.2"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "io-util", "process", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
reqwest = { version = "0.12", features = ["blocking"] }
vst3 = "0.3"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security", "Win32_System_Com", "Win32_System_JobObjects", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
daw-ui-platform = { path = "../gui_01/crates/platform" }
daw-ui-renderer = { path = "../gui_01/crates/renderer" }
daw-ui-core = { path = "../gui_01/crates/ui" }
winit = "0.30.13"
raw-window-handle = "0.6.2"
