[package]
name = "daw_audio"
version.workspace = true
edition.workspace = true
authors.workspace = true
# 自作コードは GPL-3.0-or-later。 加えて `src/asio/sys.rs` が ASIO SDK のヘッダの宣言を
# 書き起こしたもの = SDK の GPL Version 3 (or later 無し) の派生物なので複合式で宣言する
# (REUSE.toml と一致)。
license = "GPL-3.0-or-later AND GPL-3.0-only"
repository.workspace = true
publish.workspace = true

[dependencies]
common = { path = "../common" }
anyhow.workspace = true
arc-swap.workspace = true
assert_no_alloc = { workspace = true, optional = true }
cpal.workspace = true
hound.workspace = true
rtrb.workspace = true
signalsmith-sys = { path = "../signalsmith-sys" }
tokio.workspace = true
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
windows.workspace = true

[features]
# Debug-only: detects heap allocations in audio worker threads at
# runtime. Build with `--features rt-assert` to catch RT violations
# (Vec::push, format!, etc.) before they cause dropouts.
# `signalsmith-sys/alloc-count` も一緒に有効化する: Rust 側の allocator hook は
# vendored C++ エンジンの確保を見られないので、両方揃って初めて
# 「RT で誰も確保しない」 を機械検査できる。
rt-assert = ["dep:assert_no_alloc", "signalsmith-sys/alloc-count"]
