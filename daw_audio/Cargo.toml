[package]
name = "daw_audio"
version.workspace = true
edition.workspace = true

[dependencies]
common = { path = "../common" }
anyhow.workspace = true
arc-swap.workspace = true
assert_no_alloc = { workspace = true, optional = true }
cpal.workspace = true
hound.workspace = true
rtrb.workspace = true
signalsmith-sys = { path = "../signalsmith-sys" }
tokio.workspace = true
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
windows.workspace = true

[features]
# Debug-only: detects heap allocations in audio worker threads at
# runtime. Build with `--features rt-assert` to catch RT violations
# (Vec::push, format!, etc.) before they cause dropouts.
rt-assert = ["dep:assert_no_alloc"]
