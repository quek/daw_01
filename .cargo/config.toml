# rsmpeg (in-process libav) build config — docs/plan_video_export_libav.md.
#
# FFmpeg = BtbN n7.1 win64 LGPL shared under third_party/ffmpeg (gitignored,
# fetched per machine via `make fetch-ffmpeg`). soname: avcodec-61 / avformat-61 /
# avutil-59 / swscale-8 / swresample-5. rusty_ffmpeg pinned to 0.16.5
# (= +ffmpeg.7.1) in Cargo.lock; cargo otherwise picks 0.16.7 (+ffmpeg.8)
# because it ignores `+build` metadata.
#
# Binding: vendored at daw_gui/ffmpeg/binding_ffmpeg_7.1.rs and selected via
# FFMPEG_BINDING_PATH so rusty_ffmpeg copies it directly — NO bindgen, so the
# build needs NO libclang/LLVM. The vendored file was generated ON THIS MSVC
# machine (enum repr = c_int, which rsmpeg's `cfg(target_env="msvc")` paths
# require) with clang 18 (clang 22 mis-parses several FFmpeg structs into
# opaque `_address`-only types; the crate's own bundled binding is Linux-
# flavored with c_uint enums and does not compile under MSVC).
#
# Regenerate only when bumping the FFmpeg version: temporarily set
# FFMPEG_INCLUDE_DIR (instead of FFMPEG_BINDING_PATH), point LIBCLANG_PATH at a
# clang-18 libclang (the PyPI `libclang==18.1.1` wheel's clang/native/
# libclang.dll), `cargo clean -p rusty_ffmpeg`, build, then copy the produced
# target/debug/build/rusty_ffmpeg-*/out/binding.rs back over the vendored file.
#
# `relative = true` resolves against this config's parent (workspace root) so
# paths stay valid across machines / git worktrees.
[env]
FFMPEG_LIBS_DIR = { value = "third_party/ffmpeg/lib", relative = true }
FFMPEG_BINDING_PATH = { value = "daw_gui/ffmpeg/binding_ffmpeg_7.1.rs", relative = true }

# リンカを MSVC link.exe → 同梱の LLD (rust-lld) に切り替える。最終リンク (特に LTO 有り) が
# 大幅に速くなり、runtime コストはゼロ。rust-lld.exe は sysroot の
# lib/rustlib/x86_64-pc-windows-msvc/bin/ に同梱されており、バイナリ名だけで解決される。
# windows-msvc では rustc が COFF/MSVC フレーバを自動で渡すので -flavor link 等は不要。
# (-Clinker-features=+lld は Rust 1.95 時点で linux-gnu 専用、windows-msvc は未対応 #71520)。
# target 別セクションなので Linux ビルドには一切影響しない。
# ref: https://github.com/bevyengine/bevy/blob/main/.cargo/config_fast_builds.toml
[target.x86_64-pc-windows-msvc]
linker = "rust-lld.exe"
