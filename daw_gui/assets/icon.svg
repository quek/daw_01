<?xml version="1.0" encoding="UTF-8"?>
<!--
  daw_01 application icon (SSoT, vector).
  build.rs rasterizes this at 16/32/48/256 px via resvg into a multi-res .ico
  (exe icon) and an RGBA buffer (winit window icon). See docs/plan_icon_and_console.md.

  Motif: a cyan kick-drum waveform — a sharp transient on the left that decays
  exponentially to the right (reads as "attack" even at 16 px) — with a large
  eighth-note accent on the right. "singing-voice DAW". Palette matches the app:
  dark navy plate rgb(0.10,0.10,0.12) + cyan accent rgb(0.42..0.55, 0.78..0.85, 0.95).
  No <text> elements, so no font dependency at rasterize time.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- dark rounded plate -->
  <rect x="8" y="8" width="240" height="240" rx="52" ry="52" fill="#15151d"/>
  <rect x="9.5" y="9.5" width="237" height="237" rx="50.5" ry="50.5"
        fill="none" stroke="#2c2c40" stroke-width="3"/>

  <!-- kick-drum waveform: tallest bar on the left (sharp attack), decaying to
       the right. 5 rounded bars, vertically centered on y=130 (up/down symmetric). -->
  <g fill="#57c2ef">
    <rect x="26"  y="44"  width="22" height="172" rx="11"/>
    <rect x="60"  y="71"  width="22" height="118" rx="11"/>
    <rect x="94"  y="90"  width="22" height="80"  rx="11"/>
    <rect x="128" y="103" width="22" height="54"  rx="11"/>
    <rect x="162" y="111" width="22" height="38"  rx="11"/>
  </g>

  <!-- large eighth note accent, right side -->
  <g fill="#d6f0ff">
    <!-- stem -->
    <rect x="205" y="64" width="16" height="114" rx="8"/>
    <!-- flag: sweeps off the upper-right of the stem; the stem's rounded top
         stays the clean apex of the note (no spike poking above the flag). -->
    <path d="M218 66 q28 12 25 54 q-5 -32 -25 -42 z"/>
    <!-- note head -->
    <ellipse cx="186" cy="172" rx="35" ry="27" transform="rotate(-20 186 172)"/>
  </g>
</svg>
