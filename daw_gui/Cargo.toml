[package]
name = "daw_gui"
version.workspace = true
edition.workspace = true

[dependencies]
common = { path = "../common" }
anyhow.workspace = true
dirs.workspace = true
reqwest.workspace = true
boa_engine = { version = "0.21", optional = true }
midir.workspace = true
midly.workspace = true
rfd.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
unicode-width.workspace = true
daw-ui-platform.workspace = true
daw-ui-renderer.workspace = true
daw-ui-core.workspace = true
winit.workspace = true
raw-window-handle.workspace = true
wgpu.workspace = true
hound = "3.5"
sha2 = "0.10"
image.workspace = true
sysinfo.workspace = true

[features]
# `--script` headless テスト駆動 (src/script.rs) の JS エンジン boa_engine (単体
# コンパイル ~112s = コールドビルド最大の単独コスト) を default ビルドから除外する。
# 通常起動 / post-commit release / make release / fresh worktree は boa を一切
# コンパイルしない。headless script テストを回すときだけ `--features script` を付ける:
#   cargo run -p daw_gui --features script -- --script <path.js> [--output ...] [--arg K=V]
script = ["dep:boa_engine"]

[target.'cfg(windows)'.dependencies]
windows.workspace = true
# in-process libav for video export (NVENC h264 + AAC + mp4 mux).
# 0.17 == +ffmpeg.7.1, ABI-matched to third_party/ffmpeg (BtbN n7.1 lgpl-shared).
# docs/plan_video_export_libav.md.
rsmpeg = "0.17"

[build-dependencies]
# #47 app icon: rasterize assets/icon.svg at build time into a multi-res .ico
# (exe icon, via embed-resource) + a 256px RGBA buffer (winit window icon).
# resvg re-exports usvg + tiny_skia — do NOT list those separately (avoids a
# second mismatched tiny-skia). docs/plan_icon_and_console.md (#47).
resvg = "0.47"
ico = "0.5"
embed-resource = "3"

[dev-dependencies]
tempfile = "3"

# --script (JS driver) を起動する smoke テストは script feature 付きの bin が前提。
# required-features で宣言しないと、default ビルドの `cargo test --workspace` が
# 「--script requires --features script」で必ず落ちる。`make test` が
# `--features daw_gui/script` を付けて全件実行する (Makefile が SSoT)。
[[test]]
name = "clip_label_display_smoke"
required-features = ["script"]

[[test]]
name = "clip_rename_smoke"
required-features = ["script"]

[[test]]
name = "device_chain_smoke"
required-features = ["script"]

[[test]]
name = "note_overlap_smoke"
required-features = ["script"]

[[test]]
name = "pdc_real_vst3"
required-features = ["script"]

[[test]]
name = "scale_smoke"
required-features = ["script"]

[[test]]
name = "sidechain_real_vst3"
required-features = ["script"]

[[test]]
name = "split_glue_smoke"
required-features = ["script"]

[[test]]
name = "split_glue_video_smoke"
required-features = ["script"]
