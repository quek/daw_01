SPDX-FileCopyrightText = "Copyright (C) 2026 Tahara Yoshinori"
SPDX-License-Identifier = "GPL-3.0-or-later"
SPDX-FileComment = "JSON はコメント構文を持たない。"

[[annotations]]
path = "NOTICE"
precedence = "override"
SPDX-FileCopyrightText = "Copyright (C) 2026 Tahara Yoshinori"
SPDX-License-Identifier = "GPL-3.0-or-later"
SPDX-FileComment = "第三者コンポーネントの帰属をまとめた法的文書。中に引用している各社の notice はそれぞれの著作者のもの。拡張子を持たないプレーンテキストなのでコメント構文が無い。"

[[annotations]]
path = "daw_gui/tests/fixtures/smoke_test.mp4"
precedence = "override"
SPDX-FileCopyrightText = "Copyright (C) 2026 Tahara Yoshinori"
SPDX-License-Identifier = "GPL-3.0-or-later"
