path = "Cargo.lock"
precedence = "override"
SPDX-FileCopyrightText = "Copyright (C) 2026 Tahara Yoshinori"
SPDX-License-Identifier = "GPL-3.0-or-later"
SPDX-FileComment = "cargo が再生成するのでヘッダを保持できない。"

